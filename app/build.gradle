plugins {
    id 'com.android.application'
}

android {
    namespace 'com.taxreport.calculator'
    compileSdk 34

    defaultConfig {
        applicationId 'com.taxreport.calculator'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // A fixed signing key, so every new APK installs over the old one and keeps the saved data.
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'F_DQhYDdic4SuOz1j5Coy18A'
            keyAlias 'taxreport'
            keyPassword 'F_DQhYDdic4SuOz1j5Coy18A'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
